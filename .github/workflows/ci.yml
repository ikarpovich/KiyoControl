name: macOS CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode 26 toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -version | awk '/^Xcode / { if ($2 < 26) exit 1; found=1 } END { if (!found) exit 1 }'
          xcrun --sdk macosx --show-sdk-version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift sources
        run: swiftlint lint --strict

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project KiyoControl.xcodeproj -scheme KiyoControl

      - name: Build and run unit tests
        run: >-
          xcodebuild test
          -project KiyoControl.xcodeproj
          -scheme KiyoControl
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
