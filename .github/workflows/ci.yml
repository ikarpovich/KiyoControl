name: macOS CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode 26 toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -version | awk '/^Xcode / { if ($2 < 26) exit 1; found=1 } END { if (!found) exit 1 }'
          xcrun --sdk macosx --show-sdk-version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift sources
        run: swiftlint lint --strict

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project KiyoControl.xcodeproj -scheme KiyoControl

      - name: Build and run unit tests
        run: >-
          xcodebuild test
          -project KiyoControl.xcodeproj
          -scheme KiyoControl
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: >-
          xcodebuild build
          -project KiyoControl.xcodeproj
          -scheme KiyoControl
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/ReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Package release app
        if: github.event_name != 'pull_request'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/ReleaseDerivedData/Build/Products/Release/KiyoControl.app"
          "$RUNNER_TEMP/KiyoControl-macOS-arm64.zip"

      - name: Upload release app artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KiyoControl-macOS-arm64
          path: ${{ runner.temp }}/KiyoControl-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30
